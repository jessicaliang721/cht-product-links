    const params = new URLSearchParams();
    if (state.category !== 'All') params.set('category', state.category);
    if (state.query.trim()) params.set('q', state.query.trim());
    if (state.productId) params.set('product', state.productId);
    if (state.view !== 'collections') params.set('view', state.view);
    const query = params.toString();
    window.history.replaceState(null, '', query ? `?${query}` : window.location.pathname);
  } catch (_) { /* address-bar sync is best-effort */ }
}
function getInitialParams(sourceUrls) {
  const sources = sourceUrls || (() => {
    const urls = [];
    try { urls.push(window.location.href); } catch (_) {}
    try {
      if (window.top !== window) urls.push(window.top.location.href);
    } catch (_) { /* the public wrapper is cross-origin */ }
    if (document.referrer) urls.push(document.referrer);
    return urls;
  })();
  for (const source of sources) {
    try {
      const params = new URL(source, window.location.href).searchParams;
      if (params.has('category') || params.has('q') || params.has('product') || params.has('view')) return params;
    } catch (_) { /* try the next available URL source */ }
  }
  return new URLSearchParams();
}
function applyParams() {
  const params = getInitialParams();
  const categoryParam = params.get('category');
  if (categoryParam) {
    const match = [...new Set(products.map(product => product.category))]
      .find(category => category.toLocaleLowerCase() === categoryParam.trim().toLocaleLowerCase());
    if (match) state.category = match;
  }
  const queryParam = params.get('q');
  if (queryParam) { state.query = queryParam; searchInput.value = queryParam; }
  const productParam = Number(params.get('product'));
  if (productParam && products.some(product => product.id === productParam)) {
    state.view = 'gallery';
    state.productId = productParam;
    if (!filteredProducts().some(product => product.id === productParam)) {
      state.category = 'All'; state.query = ''; searchInput.value = '';
    }
  } else {
    const viewParam = params.get('view');
    if (viewParam === 'collections' || viewParam === 'gallery' || viewParam === 'list') state.view = viewParam;
  }
}

function hostFor(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); }
  catch (_) { return 'saved link'; }
}
function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
}
function filteredProducts() {
  const needle = state.query.trim().toLocaleLowerCase();
  return products.filter(product => {
    const matchesCategory = state.category === 'All' || product.category === state.category;
    const haystack = `${product.name} ${product.category} ${hostFor(product.url)}`.toLocaleLowerCase();
    return matchesCategory && (!needle || haystack.includes(needle));
  });
}
function renderCategories() {
  const categories = ['All', ...new Set(products.map(product => product.category).sort())];
  categoryWrap.innerHTML = categories.map(category => `<button type="button" class="category-button" data-category="${escapeHtml(category)}" aria-pressed="${state.category === category}">${escapeHtml(category)}</button>`).join('');
}
function shuffleInPlace(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}
function collectionGroups() {
  const visible = filteredProducts();
  const groups = new Map();
  for (const product of visible) {
    const group = groups.get(product.category) || [];
    group.push(product);
    groups.set(product.category, group);
  }
  return Array.from(groups.entries())
    .sort(([left], [right]) => left.localeCompare(right))
    .map(([name, group]) => ({ name, total: group.length, products: shuffleInPlace(group.slice()).slice(0, 5) }));
}
function productImage(product, cls) {
  const has = !!product.image;
  const src = has ? product.image : LOGO;
  const alt = has ? (product.alt || product.name) : 'Cozy Hobby Time logo';
  return `<img class="${cls}" src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${LOGO}';" />`;
}
function openButtonHtml(product) {
  return `<a class="open-button" href="${escapeHtml(product.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHtml(product.name)}">${icons.arrow}<span>Open</span></a>`;
}
function collectionItemHtml(product) {
  return `<article class="collection-item">
      <a class="collection-thumb" href="${escapeHtml(product.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHtml(product.name)}">
        ${productImage(product, '')}
        <span aria-hidden="true">${icons.arrow}</span>
      </a>
      <div class="collection-item-info">
        <div class="product-title-row collection-title-row">
          <a href="${escapeHtml(product.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(product.name)}</a>
        </div>
        <p class="saved-host">${escapeHtml(hostFor(product.url))}</p>
        <div class="row-actions collection-actions">
          ${openButtonHtml(product)}
        </div>
      </div>
    </article>`;
}
function seeAllTileHtml(category, total) {
  return `<a class="collection-see-all-tile" href="#productListHeading" data-see-all="${escapeHtml(category)}" aria-label="See all ${total} ${escapeHtml(category)} products"><span>See all</span>${icons.rightArrow}</a>`;
}
function renderCollections() {
  const groups = collectionGroups();
  collectionsView.innerHTML = groups.map(({ name, total, products: sample }, index) => {
    const cards = sample.map(collectionItemHtml).join('');
    return `<section class="collection-section" aria-labelledby="collection-${index}">
        <header class="collection-header">
          <div class="collection-heading-group">
            <h2 id="collection-${index}">${escapeHtml(name)}</h2>
            <p>${total} ${total === 1 ? 'find' : 'finds'}</p>
          </div>
          <a class="collection-see-all-link" href="#productListHeading" data-see-all="${escapeHtml(name)}">See all ${icons.rightArrow}</a>
        </header>
        <div class="collection-shelf-shell">
          <div class="collection-items" data-shelf="${escapeHtml(name)}">${cards}${seeAllTileHtml(name, total)}</div>
        </div>
      </section>`;
  }).join('');
  collectionsView.querySelectorAll('.collection-items').forEach(setupShelfArrows);
}
function setupShelfArrows(shelf) {
  const shell = shelf.closest('.collection-shelf-shell');
  const name = shelf.dataset.shelf;
  function update() {
    const canLeft = shelf.scrollLeft > 2;
    const canRight = shelf.scrollLeft + shelf.clientWidth < shelf.scrollWidth - 2;
    let leftBtn = shell.querySelector('.collection-scroll-arrow--left');
    let rightBtn = shell.querySelector('.collection-scroll-arrow--right');
    if (canLeft && !leftBtn) {
      leftBtn = document.createElement('button');
      leftBtn.type = 'button';
      leftBtn.className = 'collection-scroll-arrow collection-scroll-arrow--left';
      leftBtn.setAttribute('aria-label', 'Scroll ' + name + ' left');
      leftBtn.innerHTML = icons.rightArrow;
      leftBtn.addEventListener('click', () => scrollShelf(shelf, -1));
      shell.appendChild(leftBtn);
    } else if (!canLeft && leftBtn) {
      leftBtn.remove();
    }
    if (canRight && !rightBtn) {
      rightBtn = document.createElement('button');
      rightBtn.type = 'button';
      rightBtn.className = 'collection-scroll-arrow collection-scroll-arrow--right';
      rightBtn.setAttribute('aria-label', 'Scroll ' + name + ' right');
      rightBtn.innerHTML = icons.rightArrow;
      rightBtn.addEventListener('click', () => scrollShelf(shelf, 1));
      shell.appendChild(rightBtn);
    } else if (!canRight && rightBtn) {
      rightBtn.remove();
    }
  }
  shelf.addEventListener('scroll', update, { passive: true });
  window.requestAnimationFrame(update);
}
function scrollShelf(shelf, direction) {
  const first = shelf.querySelector('.collection-item');
  const distance = first ? first.offsetWidth + 18 : shelf.clientWidth * 0.8;
  shelf.scrollBy({ left: direction * distance, behavior: 'smooth' });
}
function galleryCardHtml(product, highlighted) {
  return `<article id="product-${product.id}" class="product-card${highlighted ? ' is-highlighted' : ''}">
      <a class="product-media" href="${escapeHtml(product.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHtml(product.name)}">
        ${productImage(product, 'product-image')}
        <span class="product-media-overlay"><span class="view-product-label"><span class="view-product-line">View</span> <span class="view-product-line view-product-line--second">product${icons.arrow}</span></span></span>
      </a>
      <div class="product-info">
        <p class="product-category">${escapeHtml(product.category)}</p>
        <div class="product-title-row"><h2>${escapeHtml(product.name)}</h2></div>
        <p class="saved-host">${escapeHtml(hostFor(product.url))}</p>
        <div class="row-actions">
          ${openButtonHtml(product)}
        </div>
      </div>
    </article>`;
}
function rowHtml(product, highlighted) {
  return `<article id="product-${product.id}" class="product-row${highlighted ? ' is-highlighted' : ''}">
      <a class="row-thumb" href="${escapeHtml(product.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHtml(product.name)}">
        ${productImage(product, 'row-thumb-image')}
      </a>
      <div class="row-info">
        <p class="product-category">${escapeHtml(product.category)}</p>
        <div class="product-title-row row-title-row">
          <h2 class="row-title">${escapeHtml(product.name)}</h2>
        </div>
        <p class="saved-host">${escapeHtml(hostFor(product.url))}</p>
        <div class="row-actions row-actions-list">
          ${openButtonHtml(product)}
        </div>
      </div>
    </article>`;
}
function render() {
  const view = state.view;
  viewCollectionsBtn.setAttribute('aria-pressed', String(view === 'collections'));
  viewGalleryBtn.setAttribute('aria-pressed', String(view === 'gallery'));
  viewListBtn.setAttribute('aria-pressed', String(view === 'list'));
  const visible = filteredProducts();
  resultCount.textContent = visible.length === products.length ? `${products.length} curated finds` : `${visible.length} of ${products.length} curated finds`;
  sortLabel.textContent = view === 'collections' ? 'By collection' : 'A–Z';
  clearSearch.hidden = !state.query;
  const hasResults = visible.length !== 0;
  emptyState.hidden = hasResults;
  collectionsView.hidden = !hasResults || view !== 'collections';
  productRows.hidden = !hasResults || view !== 'list';
  galleryList.hidden = !hasResults || view !== 'gallery';
  if (!hasResults) return;
  if (view === 'collections') {
    renderCollections();
  } else if (view === 'list') {
    productRows.innerHTML = visible.map(product => rowHtml(product, state.productId === product.id)).join('');
  } else {
    galleryList.innerHTML = visible.map(product => galleryCardHtml(product, state.productId === product.id)).join('');
  }
}

categoryWrap.addEventListener('click', event => {
  const button = event.target.closest('[data-category]');
  if (!button) return;
  state.category = button.dataset.category;
  state.productId = null;
  renderCategories(); render(); syncUrl();
});
searchInput.addEventListener('input', () => { state.query = searchInput.value; state.productId = null; render(); syncUrl(); });
clearSearch.addEventListener('click', () => { searchInput.value = ''; state.query = ''; state.productId = null; searchInput.focus(); render(); syncUrl(); });
document.getElementById('resetFilters').addEventListener('click', () => { searchInput.value = ''; state.query = ''; state.category = 'All'; state.productId = null; renderCategories(); render(); syncUrl(); });
function setView(view) {
  state.view = view;
  state.productId = null;
  render(); syncUrl();
}
viewGalleryBtn.addEventListener('click', () => setView('gallery'));
viewCollectionsBtn.addEventListener('click', () => setView('collections'));
viewListBtn.addEventListener('click', () => setView('list'));
collectionsView.addEventListener('click', event => {
  const seeAll = event.target.closest('[data-see-all]');
  if (!seeAll) return;
  event.preventDefault();
  state.query = ''; searchInput.value = '';
  state.category = seeAll.dataset.seeAll;
  state.productId = null;
  state.view = 'gallery';
  renderCategories(); render(); syncUrl();
  listHeading.scrollIntoView({ block: 'start' });
});
if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver(
    ([entry]) => { backToTop.hidden = entry ? entry.isIntersecting : true; },
    { root: null, threshold: 0 }
  );
  observer.observe(hero);
}
backToTop.addEventListener('click', () => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  hero.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'auto' });
});

applyParams();
renderCategories();
render();
if (state.productId) {
  const target = document.getElementById(`product-${state.productId}`);
  if (target) {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.requestAnimationFrame(() => target.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }));
  }
}
  </script>
</body>
</html>
