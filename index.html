    :root {
      color-scheme: light;
      --bg: #f6f1ed;
      --surface: #fffaf7;
      --surface-soft: #fad3bc;
      --text: #356669;
      --dim: #5a817d;
      --border: #356669;
      --accent: #f67e59;
      --accent-contrast: #356669;
      --sage: #99c1bb;
      --amber: #fda009;
      --pink: #f0a4d6;
      --danger: #a63d35;
      --focus: #fda009;
      --offset: 5px 5px 0 #356669;
      --soft-offset: 5px 5px 0 #f0a4d6;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); font-family: "Poppins", ui-rounded, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .app-frame { min-height: 100%; background: var(--bg); }
    .ledger-shell { width: min(1040px, 100%); margin: 0 auto; padding: 16px 14px calc(86px + env(safe-area-inset-bottom)); }
    .brand-hero { margin-bottom: 30px; }
    .banner-frame { position: relative; margin: 0 5px 0 0; border: 2px solid var(--border); background: var(--pink); box-shadow: var(--offset); overflow: hidden; }
    .brand-banner { display: block; width: 100%; height: auto; object-fit: cover; }
    .catalog-summary { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; margin: 22px 5px 0 0; padding: 2px 0 0; }
    .catalog-summary .intro-copy { margin: 0; max-width: 700px; color: var(--text); font-size: 14px; line-height: 1.55; }
    .find-tools { margin-bottom: 22px; }
    .search-field { position: relative; display: flex; align-items: center; min-height: 58px; margin: 0 5px 0 0; background: var(--surface); border: 2px solid var(--border); box-shadow: 5px 5px 0 var(--sage); }
    .search-field > svg { position: absolute; left: 16px; color: var(--text); pointer-events: none; }
    .search-field input { width: 100%; min-width: 0; height: 56px; border: 0; padding: 0 72px 0 48px; background: transparent; color: var(--text); outline: none; font-size: 15px; }
    .search-field input::placeholder { color: var(--dim); opacity: 1; }
    .search-field:focus-within { box-shadow: 5px 5px 0 var(--amber); }
    .clear-search { position: absolute; right: 8px; min-height: 40px; border: 0; padding: 0 9px; color: var(--text); background: transparent; font-size: 12px; font-weight: 700; cursor: pointer; }
    .category-list { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; }
    .category-button { min-height: 40px; border: 2px solid var(--border); border-radius: 0; padding: 7px 12px; color: var(--text); background: var(--surface); font-size: 12px; font-weight: 700; cursor: pointer; }
    .category-button:hover { background: var(--sage); }
    .category-button[aria-pressed="true"] { background: var(--accent); color: var(--accent-contrast); box-shadow: 3px 3px 0 var(--border); }
    .list-heading { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px 12px; color: var(--text); font-size: 12px; line-height: 1.3; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .list-heading p { margin: 0; }
    .product-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; }
    .product-card { min-width: 0; }
    .product-card.is-highlighted .product-media { box-shadow: 6px 6px 0 var(--amber); }
    .product-card.is-highlighted .product-info { box-shadow: 6px 6px 0 var(--amber); }
    .product-media { position: relative; display: block; width: 100%; aspect-ratio: 1; border: 2px solid var(--border); background: var(--surface-soft); color: var(--text); overflow: hidden; text-decoration: none; }
    .product-image { display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; transition: transform .24s ease; }
    .product-placeholder { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; background: var(--surface-soft); }
    .product-placeholder::before, .product-placeholder::after { content: ""; position: absolute; width: 42%; aspect-ratio: 1; border: 2px solid var(--border); background: var(--pink); transform: rotate(45deg); }
    .product-placeholder::before { left: -24%; top: -18%; }
    .product-placeholder::after { right: -23%; bottom: -20%; background: var(--sage); }
    .product-placeholder img { position: relative; z-index: 2; width: 38%; max-width: 150px; aspect-ratio: 1; object-fit: cover; border: 2px solid var(--border); }
    .placeholder-sun { position: absolute; z-index: 1; width: 54%; aspect-ratio: 1; border: 2px solid var(--border); border-radius: 50%; background: var(--bg); }
    .placeholder-sprig { position: absolute; z-index: 3; right: 9%; top: 7%; color: var(--amber); font-family: "Sour Gummy", ui-rounded, sans-serif; font-size: clamp(38px, 11vw, 70px); line-height: 1; transform: rotate(12deg); }
    .product-media-overlay { position: absolute; z-index: 5; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgb(53 102 105 / .92); color: #f6f1ed; font-family: "Sour Gummy", ui-rounded, sans-serif; font-size: 24px; font-weight: 700; opacity: 0; transition: opacity .18s ease; }
    .product-media:hover .product-media-overlay, .product-media:focus-visible .product-media-overlay { opacity: 1; }
    .product-media:hover .product-image { transform: scale(1.025); }
    .product-info { min-height: 142px; margin-top: -2px; padding: 14px 14px 13px; border: 2px solid var(--border); background: var(--surface); }
    .product-category { margin: 0 0 5px; color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .035em; text-transform: uppercase; }
    .product-info h2 { margin: 0; font-family: "Sour Gummy", ui-rounded, sans-serif; font-size: 22px; line-height: 1.08; letter-spacing: .01em; font-weight: 650; overflow-wrap: anywhere; }
    .saved-host { margin: 6px 0 0; color: var(--dim); font-size: 10px; line-height: 1.3; font-weight: 650; overflow-wrap: anywhere; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 13px; }
    .open-button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 36px; border: 2px solid var(--border); padding: 0 10px; background: var(--accent); color: var(--accent-contrast); text-decoration: none; font-size: 11px; font-weight: 750; cursor: pointer; }
    .open-button:hover { background: var(--sage); }
    .state-panel { min-height: 200px; display: grid; place-items: center; align-content: center; gap: 12px; margin-right: 5px; border: 2px solid var(--border); background: var(--surface); box-shadow: var(--soft-offset); color: var(--dim); text-align: center; }
    .state-panel strong { color: var(--text); font-family: "Sour Gummy", ui-rounded, sans-serif; font-size: 23px; }
    .state-panel button { min-height: 42px; border: 2px solid var(--border); padding: 0 14px; background: var(--accent); color: var(--accent-contrast); font-weight: 700; cursor: pointer; }
    .disclosure { margin: 28px 0 0; color: var(--dim); font-size: 12px; line-height: 1.5; }
    .toast { position: fixed; z-index: 50; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); max-width: calc(100% - 32px); transform: translate(-50%, 18px); opacity: 0; pointer-events: none; padding: 12px 16px; border: 2px solid var(--border); background: var(--accent); color: var(--accent-contrast); box-shadow: 4px 4px 0 var(--border); font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .16s ease, transform .16s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .see-all { font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; }
    .see-all.shelf-end { align-self: center; flex: 0 0 auto; padding: 10px 16px; border: 2px solid var(--border); background: #fff; box-shadow: 3px 3px 0 var(--border); }
    @media (max-width: 430px) { .collection-shelf .product-card { flex-basis: 168px; } .collection-head h2 { font-size: 22px; } }

    ].map(([id,name,category,url,image,alt]) => ({id,name,category,url,image,alt}));

    const icons = {
      arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>'
    };
    const state = { query: '', category: 'All', productId: null, view: 'gallery' };
    const list = document.getElementById('productList');
    const empty = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');
    const search = document.getElementById('search');
    const clearSearch = document.getElementById('clearSearch');
    const categoryWrap = document.getElementById('categories');
    const viewGallery = document.getElementById('viewGallery');
    const viewCollections = document.getElementById('viewCollections');
    const collectionsView = document.getElementById('collectionsView');
    const findTools = document.getElementById('findTools');
    const listHeading = document.getElementById('listHeading');

    function syncUrl() {
      try {
        const params = new URLSearchParams();
        if (state.category !== 'All') params.set('category', state.category);
        if (state.query.trim()) params.set('q', state.query.trim());
        if (state.productId) params.set('product', state.productId);
        if (state.view === 'collections') params.set('view', 'collections');
        const query = params.toString();
        window.history.replaceState(null, '', query ? `?${query}` : window.location.pathname);
      } catch (_) { /* address-bar sync is best-effort */ }
    }
    function getInitialParams(sourceUrls) {
      const sources = sourceUrls || (() => {
        const urls = [];
        try { urls.push(window.location.href); } catch (_) {}
        try {
          if (window.top !== window) urls.push(window.top.location.href);
        } catch (_) { /* the public wrapper is cross-origin */ }
        if (document.referrer) urls.push(document.referrer);
        return urls;
      })();
      for (const source of sources) {
        try {
          const params = new URL(source, window.location.href).searchParams;
          if (params.has('category') || params.has('q') || params.has('product')) return params;
        } catch (_) { /* try the next available URL source */ }
      }
      return new URLSearchParams();
    }
    function applyParams() {
      const params = getInitialParams();
      const categoryParam = params.get('category');
      if (categoryParam) {
        const match = [...new Set(products.map(product => product.category))]
          .find(category => category.toLocaleLowerCase() === categoryParam.trim().toLocaleLowerCase());
        if (match) state.category = match;
      }
      const queryParam = params.get('q');
      if (queryParam) { state.query = queryParam; search.value = queryParam; }
      const productParam = Number(params.get('product'));
      if (productParam && products.some(product => product.id === productParam)) {
        state.view = 'gallery';
        state.productId = productParam;
        if (!filteredProducts().some(product => product.id === productParam)) {
          state.category = 'All'; state.query = ''; search.value = '';
        }
      } else if (params.get('view') === 'collections') {
        state.view = 'collections';
      }
    }

    function hostFor(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); }
      catch (_) { return 'saved link'; }
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
    function filteredProducts() {
      const needle = state.query.trim().toLocaleLowerCase();
      return products.filter(product => {
        const matchesCategory = state.category === 'All' || product.category === state.category;
        const haystack = `${product.name} ${product.category} ${hostFor(product.url)}`.toLocaleLowerCase();
        return matchesCategory && (!needle || haystack.includes(needle));
      });
    }
    function renderCategories() {
      const categories = ['All', ...new Set(products.map(product => product.category).sort())];
      categoryWrap.innerHTML = categories.map(category => `<button type="button" class="category-button" data-category="${escapeHtml(category)}" aria-pressed="${state.category === category}">${escapeHtml(category)}</button>`).join('');
    }
    const COLLECTION_ORDER = ['Covers & organizers', 'Crafts & supplies', 'Desk & tech', 'E-readers & accessories', 'Notebooks & planners', 'Pens & ink'];
    const COLLECTION_SHADOWS = ['#F0A4D6', '#FDA009', '#F67E59', '#99C1BB', '#FAD3BC', '#356669'];
    function shuffleInPlace(items) {
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }
    function collectionCardHtml(product, shadow) {
      const shadowAttr = shadow ? ' style="box-shadow: 6px 6px 0 ' + shadow + ';"' : '';
      const media = product.image
        ? `<img class="product-image" src="${escapeHtml(product.image)}" alt="${escapeHtml(product.alt || '')}" loading="lazy" />`
        : `<span class="product-placeholder" aria-hidden="true"><span class="placeholder-sun"></span><img src="assets/cozy-hobby-time-logo.jpg" alt="" /><span class="placeholder-sprig">\u2726</span></span>`;
      return `<article class="product-card">
          <a class="product-media" href="${escapeHtml(product.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHtml(product.name)}">
            ${media}
            <span class="product-media-overlay">View product ${icons.arrow}</span>
          </a>
          <div class="product-info"${shadowAttr}>
            <p class="product-category">${escapeHtml(product.category)}</p>
            <h2>${escapeHtml(product.name)}</h2>
            <p class="saved-host">${escapeHtml(hostFor(product.url))}</p>
            <div class="row-actions">
              <a class="open-button" href="${escapeHtml(product.url)}" target="_blank" rel="noopener noreferrer">Open ${icons.arrow}</a>
            </div>
          </div>
        </article>`;
    }
    function renderCollections() {
      collectionsView.innerHTML = COLLECTION_ORDER.map((category, index) => {
        const items = products.filter(product => product.category === category);
        if (!items.length) return '';
        const sample = shuffleInPlace(items.slice()).slice(0, 5);
        const shadow = COLLECTION_SHADOWS[index % COLLECTION_SHADOWS.length];
        const cards = sample.map(product => collectionCardHtml(product, shadow)).join('');
        return `<section class="collection-section" aria-label="${escapeHtml(category)}">
          <div class="collection-head">
            <h2>${escapeHtml(category)}</h2>
            <a class="see-all" href="#" data-see-all="${escapeHtml(category)}">See all &rarr;</a>
          </div>
          <p class="collection-count">${items.length} finds</p>
          <div class="collection-shelf">${cards}<a class="see-all shelf-end" href="#" data-see-all="${escapeHtml(category)}">See all &rarr;</a></div>
        </section>`;
      }).join('');
    }
    function render() {
      const isCollections = state.view === 'collections';
      viewGallery.setAttribute('aria-pressed', String(!isCollections));
      viewCollections.setAttribute('aria-pressed', String(isCollections));
      findTools.hidden = isCollections;
      listHeading.hidden = isCollections;
      collectionsView.hidden = !isCollections;
      if (isCollections) { list.hidden = true; empty.hidden = true; renderCollections(); return; }
      const visible = filteredProducts();
      resultCount.textContent = visible.length === products.length ? `${products.length} curated finds` : `${visible.length} of ${products.length} curated finds`;
      clearSearch.hidden = !state.query;
      list.hidden = visible.length === 0;
      empty.hidden = visible.length !== 0;
      list.innerHTML = visible.map((product) => {
        const media = product.image
          ? `<img class="product-image" src="${escapeHtml(product.image)}" alt="${escapeHtml(product.alt || '')}" loading="lazy" />`
          : `<span class="product-placeholder" aria-hidden="true"><span class="placeholder-sun"></span><img src="assets/cozy-hobby-time-logo.jpg" alt="" /><span class="placeholder-sprig">✦</span></span>`;
        return `<article id="product-${product.id}" class="product-card${state.productId === product.id ? ' is-highlighted' : ''}">
          <a class="product-media" href="${escapeHtml(product.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHtml(product.name)}">
            ${media}
            <span class="product-media-overlay">View product ${icons.arrow}</span>
          </a>
          <div class="product-info">
            <p class="product-category">${escapeHtml(product.category)}</p>
            <h2>${escapeHtml(product.name)}</h2>
            <p class="saved-host">${escapeHtml(hostFor(product.url))}</p>
            <div class="row-actions">
              <a class="open-button" href="${escapeHtml(product.url)}" target="_blank" rel="noopener noreferrer">Open ${icons.arrow}</a>
            </div>
          </div>
        </article>`;
      }).join('');
    }

    categoryWrap.addEventListener('click', event => {
      const button = event.target.closest('[data-category]');
      if (!button) return;
      state.category = button.dataset.category;
      state.productId = null;
      renderCategories(); render(); syncUrl();
    });
    search.addEventListener('input', () => { state.query = search.value; state.productId = null; render(); syncUrl(); });
    clearSearch.addEventListener('click', () => { search.value = ''; state.query = ''; state.productId = null; search.focus(); render(); syncUrl(); });
    document.getElementById('resetFilters').addEventListener('click', () => { search.value = ''; state.query = ''; state.category = 'All'; state.productId = null; renderCategories(); render(); syncUrl(); });
    viewGallery.addEventListener('click', () => { state.view = 'gallery'; state.productId = null; render(); syncUrl(); });
    viewCollections.addEventListener('click', () => { state.view = 'collections'; state.productId = null; render(); syncUrl(); });
    collectionsView.addEventListener('click', event => {
      const seeAll = event.target.closest('[data-see-all]');
      if (!seeAll) return;
      event.preventDefault();
      state.view = 'gallery'; state.category = seeAll.dataset.seeAll; state.productId = null;
      renderCategories(); render(); syncUrl();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    applyParams();
    renderCategories();
    render();
    if (state.productId) {
      const target = document.getElementById(`product-${state.productId}`);
      if (target) {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.requestAnimationFrame(() => target.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }));
      }
    }
  </script>
